name: Deploy (VPS)

# Builds the web and API images of a commit that passed CI on main, pushes them to GitHub's
# container registry and deploys them to the VPS (deploy/README.md). Can also be started by
# hand for the head of main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# One deploy at a time, in order; a newer commit waits instead of cancelling a running deploy.
concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: api
            build-args: ''
          # Compiled into the web app (apps/web/Dockerfile); set under Settings → Secrets and
          # variables → Actions → Variables.
          - app: web
            build-args: |
              NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
              SITE_INDEXING=${{ vars.SITE_INDEXING }}
              NEXT_PUBLIC_MAP_TILE_URL=${{ vars.MAP_TILE_URL }}
              NEXT_PUBLIC_MAP_ATTRIBUTION=${{ vars.MAP_ATTRIBUTION }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          build-args: ${{ matrix.build-args }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/walls-${{ matrix.app }}:${{ env.SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      # VPS_SSH_KEY: the private half of the deploy user's key. VPS_KNOWN_HOSTS: the server's
      # host keys (`ssh-keyscan <host>`), so the connection fails if the server changes.
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy the stack configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: scp deploy/compose.yaml deploy/Caddyfile deploy/deploy.sh deploy/backup.sh "deploy@$VPS_HOST:/opt/walls/"
      # The registry token is valid only while this job runs; deploy.sh logs out afterwards.
      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" |
            ssh "deploy@$VPS_HOST" "bash /opt/walls/deploy.sh '$SHA' '${{ github.actor }}'"
