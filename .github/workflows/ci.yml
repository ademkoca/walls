name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        # Keep in sync with docker-compose.yml.
        image: postgres:17-alpine
        env:
          POSTGRES_USER: walls
          POSTGRES_PASSWORD: walls
          POSTGRES_DB: walls_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U walls -d walls_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://walls:walls@localhost:5432/walls_test
      # The web build compiles the /api rewrite target; CI has no running API.
      API_INTERNAL_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7

      # Installs the pnpm version pinned in package.json "packageManager".
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build

      # Real-browser journeys. Builds and starts the API and web app itself (see e2e/playwright.config.ts).
      - run: pnpm --filter @walls/e2e exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-output
          path: e2e/.output/
          retention-days: 7
