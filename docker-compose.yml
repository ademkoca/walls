# Local development services. Credentials below are for local use only.
services:
  postgres:
    # Keep the major version aligned with the Supabase production database.
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: walls
      POSTGRES_PASSWORD: walls
      POSTGRES_DB: walls
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U walls -d walls']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
