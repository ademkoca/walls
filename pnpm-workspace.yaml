packages:
  - apps/*
  - packages/*
  - e2e

# Versions shared by several workspace packages. Reference them with "catalog:".
catalog:
  '@types/node': ^22.20.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  react: ^19.3.0
  react-dom: ^19.3.0
  typescript: ~6.0.3
  vitest: ^5.0.3

# Dependency install scripts are blocked unless listed here (true = allowed to run).
allowBuilds:
  # The platform binary comes from esbuild's optional dependencies; its postinstall check is not needed.
  esbuild: false
  # Pulled in by next-intl. Both ship prebuilt binaries as optional dependencies; their
  # scripts only compile from source when no prebuilt binary matches the platform.
  '@parcel/watcher': false
  '@swc/core': false
