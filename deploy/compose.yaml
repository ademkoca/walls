# One Walls environment on the VPS: the web app and the API. Production and staging each run
# their own copy from /opt/walls/<environment>, next to .env (Compose variables) and api.env
# (the API's secrets); Caddy (caddy/compose.yaml) sends their traffic here. See deploy/README.md.
name: walls-${WALLS_ENVIRONMENT:?}

x-api-image: &api-image ${IMAGE_PREFIX:?}/walls-api:${WALLS_VERSION:?}

services:
  web:
    # The web image has the environment's site address compiled in, so each has its own.
    image: ${IMAGE_PREFIX:?}/walls-web:${WALLS_VERSION:?}-${WALLS_ENVIRONMENT:?}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      - '127.0.0.1:${WEB_PORT:?}:3000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/robots.txt').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: ${WEB_MEMORY:?}

  api:
    image: *api-image
    restart: unless-stopped
    env_file: api.env
    environment:
      NODE_ENV: production
      API_PORT: '4000'
      # Caddy is the only proxy in front of the API, and it replaces any X-Forwarded-For
      # a visitor sends, so the last entry is the visitor's address.
      TRUST_PROXY_HOPS: '1'
    ports:
      - '127.0.0.1:${API_PORT:?}:4000'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: ${API_MEMORY:?}

  # One-off: `docker compose run --rm migrate` (deploy.sh runs it before every start).
  migrate:
    image: *api-image
    profiles: [tools]
    env_file: api.env
    environment:
      NODE_ENV: production
    command: ['node', 'dist/migrate.mjs']
