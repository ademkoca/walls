# Caddy for every Walls environment on the VPS: HTTPS for walls.rs (production) and
# preview.walls.rs (staging), each sent to its own web app and API (../compose.yaml). Lives in
# /opt/walls/caddy next to Caddyfile and .env, apart from the environments, so deploying one
# of them never restarts the proxy the other uses. See deploy/README.md.
name: walls-caddy

services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    # On the host's network, so Caddy sees every visitor's real IPv4 or IPv6 address (Docker's
    # port publishing would replace IPv6 visitors' addresses with its own). It reaches the web
    # apps and the APIs on 127.0.0.1.
    network_mode: host
    environment:
      PRODUCTION_HOST: ${PRODUCTION_HOST:?}
      STAGING_HOST: ${STAGING_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m

volumes:
  # Certificates and ACME account; keep them, or Let's Encrypt rate limits may apply.
  caddy-data:
  caddy-config:
